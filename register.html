<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | مِستودع المهارات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo-back">← الرئيسية</a>
                <div class="modal-icon">✨</div>
                <h2>إنشاء حساب جديد</h2>
                <p>انضم إلى منصة مِستودع المهارات</p>
            </div>
            <form onsubmit="alert('تم إنشاء الحساب بنجاح (تجريبي)'); return false;">
                <label>الاسم الكامل</label>
                <input type="text" placeholder="مثال: جناء أو لولوه" required>
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@email.com" required>
                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••" required>
                <button type="submit" class="primary-btn full" style="margin-top: 15px;">تسجيل وحفظ</button>
            </form>
            <p class="modal-footer" style="margin-top: 15px; text-align: center;">
                لديك حساب بالفعل؟ <a href="index.html" style="color: #2563eb;">الرئيسية</a>
            </p>
        </div>
    </div>
</body>
</html>
